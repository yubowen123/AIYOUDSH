name: Stage verified v0.8.6 release artifacts

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  stage-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the successful three-platform build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 40898135331
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: AIYOUDSH-*
          path: artifacts
      - name: Verify all four archives against the reviewed release checksums
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib, shutil
          expected = {
              'macos-arm64': ('AIYOUDSH-darwin-arm64', 'afac7a4a9ea6904c506788440099bbf46cd3639bc85a9d0d5ac12852d5c8016d'),
              'macos-x64': ('AIYOUDSH-darwin-x64', 'ea1e85409322e5ace148cb39399a278f931da31b2ab6b59b6113a4bd6fc1e710'),
              'windows-x64': ('AIYOUDSH-win32-x64', '6898ed39669a71ad47215d22229e4af0490d0c2f74fcf19f21b55420afe6df12'),
              'source': ('AIYOUDSH-darwin-arm64', '50a13658442b49c30f689b1ce1df0e1185f786a022f8f832ed234d900eb17b44'),
          }
          stage = Path('stage'); stage.mkdir()
          for suffix, (artifact, digest) in expected.items():
              name = f'AIYOUDSH-v0.8.6-{suffix}.zip'
              matches = list((Path('artifacts')/artifact).rglob(name))
              assert len(matches) == 1, (name, matches)
              path = matches[0]
              assert hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() == digest, name
              shutil.copyfile(path, stage/name)
              print(digest, name)
          PYVERIFY
      - name: Require the existing draft release
        shell: bash
        run: gh api repos/$GH_REPO/releases/428042046 --jq '.draft == true and .tag_name == "v0.8.6"' | grep -x true
      - name: Upload verified archives while keeping the release draft
        shell: bash
        run: gh release upload v0.8.6 stage/*.zip --clobber
      - name: Read back uploaded names, states, sizes and digests
        shell: bash
        run: gh api repos/$GH_REPO/releases/428042046 --jq '{tag_name,draft,assets:[.assets[]|{name,state,size,digest}]}'
